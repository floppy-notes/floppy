name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage threshold
        run: |
          go tool cover -func=coverage.out | tail -1
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          if awk "BEGIN {exit !($pct < 90)}"; then
            echo "coverage $pct% is below the 90% threshold"
            exit 1
          fi

      - name: upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: smoke
        run: |
          go build -o floppy ./cmd/floppy
          ./floppy --version
          vault=$(mktemp -d)
          ./floppy --vault "$vault" create task --title "ci smoke" --due 2026-12-31 --quiet
          ./floppy --vault "$vault" list --type task | grep -q '"count": 1'
          ./floppy --vault "$vault" search smoke | grep -q "ci smoke"
